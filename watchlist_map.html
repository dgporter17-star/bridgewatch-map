<style>
.bw-filter{background:#fff;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.4);
  font:12px/1.35 "Segoe UI",system-ui,sans-serif;color:#222;max-width:210px;}
.bw-filter .bw-head{display:flex;align-items:center;gap:6px;padding:6px 9px;cursor:pointer;
  font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;user-select:none;}
.bw-filter .bw-head b{margin-left:auto;font-weight:400;color:#666;font-size:14px;line-height:1;}
.bw-filter .bw-body{display:none;padding:0 9px 8px;border-top:1px solid #e3e3e3;
  max-height:60vh;overflow:auto;}
.bw-filter.open .bw-body{display:block;}
.bw-filter .bw-sec{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:#777;margin:8px 0 3px;}
.bw-filter label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;}
.bw-filter label i{margin-left:auto;font-style:normal;color:#888;font-variant-numeric:tabular-nums;}
.bw-filter input{margin:0;cursor:pointer;}
.bw-filter .bw-btns{display:flex;gap:6px;margin-top:8px;}
.bw-filter .bw-btns button{flex:1;font:inherit;font-size:11px;padding:3px 0;cursor:pointer;
  background:#f4f4f4;border:1px solid #ccc;border-radius:4px;}
.bw-filter .bw-btns button:hover{background:#e8e8e8;}
</style>
